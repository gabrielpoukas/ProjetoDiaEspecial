<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Terminal de Memórias - 5 Anos</title>
</head>
<body>
    <main class="terminal-container">
        <section id="terminal-output"></section>
        <section id="image-container" class="hidden">
            <img src="./img/Sem título.jpg" alt="Nossa Foto" id="pixel-photo">
            <h2 class="heart">❤️ Feliz 5 Anos! ❤️</h2>
        </section>
        <form class="input-line">
            <label class="prompt" for="user-input">Seu Amor</label>
            <span id="cursor">_</span>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
